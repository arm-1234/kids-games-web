<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
		<meta name="theme-color" content="#fcf0d6">
		<meta name="color-scheme" content="light">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-title" content="Hum Hills">
		<meta name="description" content="Sing the road home. A hum and sing adventure for children.">
		<title>Hum Hills</title>
		<style>
:root {
	--bg: #fcf0d6;
	--ink: #4a2a1f;
	--accent: #b3472e;
	--track: #ead9b4;
}

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

html, body {
	position: fixed;
	inset: 0;
	width: 100%;
	height: 100%;
	overflow: hidden;
	overscroll-behavior: none;
	background-color: var(--bg);
	color: var(--ink);
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
}

#canvas {
	display: block;
	touch-action: none;
	-webkit-user-select: none;
	user-select: none;
	-webkit-touch-callout: none;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	gap: 1.25rem;
	background-color: var(--bg);
	font-family: 'Trebuchet MS', 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	z-index: 1;
}

#status-title {
	font-size: 2.2rem;
	font-weight: bold;
	letter-spacing: 0.04em;
}

#status-text {
	font-size: 1.2rem;
}

#status-progress {
	display: none;
	width: min(50%, 20rem);
	height: 0.9rem;
	appearance: none;
	-webkit-appearance: none;
	border: 0;
	border-radius: 0.45rem;
	background-color: var(--track);
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background-color: var(--track);
}

#status-progress::-webkit-progress-value {
	background-color: var(--accent);
}

#status-progress::-moz-progress-bar {
	background-color: var(--accent);
}

#status-notice {
	display: none;
	max-width: 30rem;
	margin: 0 2rem;
	padding: 1rem;
	border-radius: 0.5rem;
	border: 2px solid var(--accent);
	background-color: #ffffff;
	color: var(--ink);
	line-height: 1.4;
	text-align: center;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Please turn on JavaScript to play.
		</noscript>

		<div id="status" role="status" aria-live="polite">
			<div id="status-title">Hum Hills</div>
			<div id="status-text">Loading...</div>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":372744,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusText = document.getElementById('status-text');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const FRIENDLY_FAILURE = 'Sorry, the game could not start.\nPlease reload the page, or try a newer browser.';

	let initializing = true;
	let statusMode = '';

	canvas.addEventListener('contextmenu', (event) => event.preventDefault());
	canvas.addEventListener('selectstart', (event) => event.preventDefault());
	canvas.addEventListener('dragstart', (event) => event.preventDefault());
	for (const name of ['gesturestart', 'gesturechange', 'gestureend']) {
		document.addEventListener(name, (event) => event.preventDefault());
	}
	document.addEventListener('touchmove', (event) => event.preventDefault(), { passive: false });
	document.addEventListener('wheel', (event) => {
		if (event.ctrlKey) {
			event.preventDefault();
		}
	}, { passive: false });

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusText.style.display = mode === 'notice' ? 'none' : 'block';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		text.split('\n').forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		const detail = err instanceof Error ? err.message : (typeof err === 'string' ? err : '');
		setStatusNotice(detail ? FRIENDLY_FAILURE + '\n\n' + detail : FRIENDLY_FAILURE);
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			displayFailureNotice('This browser is missing features the game needs:\n' + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
